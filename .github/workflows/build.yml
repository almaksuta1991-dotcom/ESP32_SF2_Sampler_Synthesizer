name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Install ESP32 core 3.1.1
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1

      - name: Clone libraries via git
        run: |
          mkdir -p libs
          git clone --depth 1 https://github.com/olikraus/U8g2_Arduino.git libs/u8g2
          git clone --depth 1 https://github.com/FortySevenEffects/arduino_midi_library.git libs/midi

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,USBMode=default,FlashSize=16M,PartitionScheme=custom" \
            --libraries ./libs \
            --build-path ./build \
            ./SF2Sampler

      - name: Install mklittlefs
        run: |
          mkdir -p /tmp/mklittlefs
          curl -L https://github.com/earlephilhower/mklittlefs/releases/download/4.1.0/x86_64-linux-gnu-mklittlefs-42acb97.tar.gz | tar xz -C /tmp/mklittlefs
          cp /tmp/mklittlefs/mklittlefs /usr/local/bin/
          chmod +x /usr/local/bin/mklittlefs
          mklittlefs --version

      - name: Build LittleFS image
        run: |
          mklittlefs -c SF2Sampler/data -b 4096 -p 256 -s 0xF00000 littlefs.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF2Sampler-firmware
          path: |
            build/*.bin
            littlefs.bin
